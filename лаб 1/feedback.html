<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зворотній зв'язок — Ірпінська міська рада</title>
</head>
<body>

    <header>
        <img src="./pic/IRPIN.png" width="90" alt="Герб міста Ірпінь">
        <h1>Електронне звернення до Ірпінської міської ради</h1>
        <nav>
            <a href="main.html"><button type="button">На Головну сторінку</button></a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Форма зворотного зв'язку</h2>

        <form action="#" method="post">
            
            <fieldset>
                <legend>Персональна інформація</legend>
                
                <p>
                    <label for="user-fullname">Прізвище та ім'я:</label><br>
                    <input type="text" id="user-fullname" name="user_fullname" required>
                </p>
                
                <p>
                    <label for="user-email">E-mail:</label><br>
                    <input type="email" id="user-email" name="user_email" required>
                </p>
                
                <p>
                    <label for="user-age">Вік:</label><br>
                    <input type="number" id="user-age" name="user_age" min="18" max="120">
                </p>
                
                <p>
                    <label for="user-education">Освіта:</label><br>
                    <select id="user-education" name="user_education">
                        <option value="incomplete">Неповна</option>
                        <option value="complete">Повна</option>
                        <option value="vocational">Професійна</option>
                        <option value="higher" selected>Вища</option>
                    </select>
                </p>
            </fieldset>

            <p>
                <label for="feedback-purpose">Мета зворотнього зв'язку:</label><br>
                <select id="feedback-purpose" name="feedback_purpose">
                    <option value="cooperation">Співпраця</option>
                    <option value="complaint">Скарга на порушення права власності</option>
                    <option value="suggestion">Пропозиція</option>
                    <option value="error">Наявність помилки</option>
                </select>
            </p>

            <p>
                <label for="feedback-details">Детально:</label><br>
                <textarea id="feedback-details" name="feedback_details" rows="6" cols="50" maxlength="500" placeholder="Введіть текст звернення (обмеження до 500 символів)..."></textarea>
            </p>

            <p>
                <label>
                    <input type="checkbox" name="consent" required>
                    Я надаю згоду на обробку моїх персональних даних
                </label>
            </p>

            <p>
                <input type="submit" value="Відправити">
                <input type="reset" value="Очистити форму">
            </p>
            
        </form>
    </main>

    <hr>

    <footer>
        <p><small>&copy; 2026 Виконавчий комітет Ірпінської міської ради.</small></p>
    </footer>

</body>
</html>
